# Experiment 001: Centralized hub-and-spoke (5 agents)
# Coordinator dispatches, workers report back. MCP broker messaging.
# Mechanical enforcement: native Agent/TeamCreate/SendMessage blocked.
#
# Usage:
#   helm benchmark run experiments/001_topology_enforcement_baseline/configs/centralized-5.yaml \
#     -n 8 --on-turn-limit end \
#     --experiments-dir experiments/001_topology_enforcement_baseline/runs

name: exp001-centralized-5

shared_context: |
  You are part of a team working on a coding task.

agents:
  - id: coordinator
    harness: claude-code
    role: hub
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [researcher_a, researcher_b, implementer, reviewer]
    context: |
      You coordinate the team. You do not edit code yourself.
      When the task is complete and verified, use signal_complete.

  - id: researcher_a
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [coordinator]
    context: |
      You are researcher_a. The coordinator assigns work and collects results.

  - id: researcher_b
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [coordinator]
    context: |
      You are researcher_b. The coordinator assigns work and collects results.

  - id: implementer
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [coordinator]
    context: |
      You are the implementer. The coordinator assigns work and collects results.

  - id: reviewer
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [coordinator]
    context: |
      You are the reviewer. The coordinator assigns work and collects results.

coordination:
  mechanism: messaging
  enforcement: mechanical

evaluation:
  dimensions:
    - escalation-calibration
    - goal-drift
    - context-degradation
    - resource-waste
    - human-model-accuracy
    - topology-adherence
  judge:
    backend: claude-headless
    model: claude-sonnet-4-6

benchmark:
  adapter: swebench
  id: princeton-nlp/SWE-bench_Verified
  dataset_path: data/swe_bench_verified.jsonl
  example_ids:
    - sympy__sympy-17630
    - sympy__sympy-21930
    - django__django-13195
    - pytest-dev__pytest-5809
    - django__django-12754
    - matplotlib__matplotlib-23412
    - sphinx-doc__sphinx-8638
    - pytest-dev__pytest-7205
  verifier:
    mode: command
    command: >-
      python scripts/verify_swebench.py
      --instance-id {example_id}
      --experiment-dir {experiment_dir}
      --dataset-path {dataset_path}
      --timeout 300
    pass_exit_codes: [0]

limits:
  max_duration: 60m
