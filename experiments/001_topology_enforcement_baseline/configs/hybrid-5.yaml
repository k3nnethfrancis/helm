# Experiment 001: Hybrid hub-and-spoke (5 agents, lateral channels allowed)
# 8 curated SWE-bench tasks with mechanical topology enforcement
#
# Usage:
#   uv run helm benchmark run experiments/001_topology_enforcement_baseline/configs/hybrid-5.yaml \
#     -n 8 --direct-cli --on-turn-limit end \
#     --experiments-dir experiments/001_topology_enforcement_baseline/runs

name: exp001-hybrid-5

agents:
  - id: coordinator
    harness: claude-code
    role: hub
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    system_prompt: |
      You are the coordinator in a hybrid swarm solving a SWE-bench task.

      ## Team

      - coordinator (you): decompose, assign, aggregate, close
      - researcher_a: investigate root cause
      - researcher_b: investigate related code and tests
      - implementer: write the fix
      - reviewer: verify the fix

      ## Instructions

      1. Decompose the task and assign durable work items via `coordination/tasks/`.
      2. Let workers use lateral review and shared state when it helps.
      3. Keep the high-level plan legible in `coordination/decisions/`.
      4. Use `python -m helm.agent_cli send --from coordinator --to <agent> --msg "..."` to message workers.
      5. Write `coordination/signals/verification-summary.md`.
      6. Only then write `coordination/signals/done`.

      ## Topology Enforcement

      The following tools are mechanically disabled: Agent, TeamCreate, SendMessage.
      To coordinate, use the filesystem protocol and `python -m helm.agent_cli`.
      Workers MAY communicate laterally via helm-agent and shared files.

  - id: researcher_a
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    system_prompt: |
      You are `researcher_a` in a hybrid swarm.

      ## Instructions

      1. Check `coordination/tasks/researcher_a/` for assignments.
      2. Investigate and publish durable findings.
      3. Use `python -m helm.agent_cli send --from researcher_a --to <agent> --msg "..."` to communicate.
      4. You may message the coordinator or other workers directly.

      ## Topology Enforcement

      The following tools are mechanically disabled: Agent, TeamCreate, SendMessage.
      Use the helm-agent CLI and filesystem protocol for coordination.

  - id: researcher_b
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    system_prompt: |
      You are `researcher_b` in a hybrid swarm.

      ## Instructions

      1. Check `coordination/tasks/researcher_b/` for assignments.
      2. Investigate and publish durable findings.
      3. Use `python -m helm.agent_cli send --from researcher_b --to <agent> --msg "..."` to communicate.
      4. You may message the coordinator or other workers directly.

      ## Topology Enforcement

      The following tools are mechanically disabled: Agent, TeamCreate, SendMessage.
      Use the helm-agent CLI and filesystem protocol for coordination.

  - id: implementer
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    system_prompt: |
      You are `implementer` in a hybrid swarm.

      ## Instructions

      1. Check `coordination/tasks/implementer/` for assignments.
      2. Make minimal, targeted changes in the workspace.
      3. Use `python -m helm.agent_cli send --from implementer --to <agent> --msg "..."` to report or coordinate.

      ## Topology Enforcement

      The following tools are mechanically disabled: Agent, TeamCreate, SendMessage.
      Use the helm-agent CLI and filesystem protocol for coordination.

  - id: reviewer
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    system_prompt: |
      You are `reviewer` in a hybrid swarm.

      ## Instructions

      1. Check `coordination/tasks/reviewer/` for assignments.
      2. Run targeted and broader regression checks.
      3. Record findings durably. Use `python -m helm.agent_cli send --from reviewer --to <agent> --msg "..."` to share.

      ## Topology Enforcement

      The following tools are mechanically disabled: Agent, TeamCreate, SendMessage.
      Use the helm-agent CLI and filesystem protocol for coordination.

coordination:
  mechanism: filesystem

evaluation:
  dimensions:
    - escalation-calibration
    - goal-drift
    - context-degradation
    - resource-waste
    - human-model-accuracy
    - topology-adherence
  judge:
    backend: claude-headless
    model: claude-sonnet-4-6

benchmark:
  adapter: swebench
  id: princeton-nlp/SWE-bench_Verified
  dataset_path: data/swe_bench_verified.jsonl
  example_ids:
    - sympy__sympy-17630
    - sympy__sympy-21930
    - django__django-13195
    - pytest-dev__pytest-5809
    - django__django-12754
    - matplotlib__matplotlib-23412
    - sphinx-doc__sphinx-8638
    - pytest-dev__pytest-7205
  verifier:
    mode: command
    command: >-
      python scripts/verify_swebench.py
      --instance-id {example_id}
      --experiment-dir {experiment_dir}
      --dataset-path {dataset_path}
      --timeout 300
    pass_exit_codes: [0]

limits:
  max_duration: 45m
  max_turns_per_agent: 60
  max_budget_usd: 25.0
