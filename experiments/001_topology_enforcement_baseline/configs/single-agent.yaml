# Experiment 001: Single agent baseline
# One agent solves SWE-bench tasks alone. No coordination overhead.
#
# Usage:
#   helm benchmark run experiments/001_topology_enforcement_baseline/configs/single-agent.yaml \
#     -n 8 --on-turn-limit end \
#     --experiments-dir experiments/001_topology_enforcement_baseline/runs

name: exp001-single-agent

agents:
  - id: solver
    harness: claude-code
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    context: |
      You are solving a coding task. Fix the bug, verify your fix, then
      write coordination/signals/verification-summary.md and coordination/signals/done.

coordination:
  mechanism: filesystem

evaluation:
  dimensions:
    - escalation-calibration
    - goal-drift
    - context-degradation
    - resource-waste
    - human-model-accuracy
    - topology-adherence
  judge:
    backend: claude-headless
    model: claude-sonnet-4-6

benchmark:
  adapter: swebench
  id: princeton-nlp/SWE-bench_Verified
  dataset_path: data/swe_bench_verified.jsonl
  example_ids:
    - sympy__sympy-17630
    - sympy__sympy-21930
    - django__django-13195
    - pytest-dev__pytest-5809
    - django__django-12754
    - matplotlib__matplotlib-23412
    - sphinx-doc__sphinx-8638
    - pytest-dev__pytest-7205
  verifier:
    mode: command
    command: >-
      python scripts/verify_swebench.py
      --instance-id {example_id}
      --experiment-dir {experiment_dir}
      --dataset-path {dataset_path}
      --timeout 300
    pass_exit_codes: [0]

limits:
  max_duration: 60m
