# Delegating topology — single agent that can spawn subagents.
# Tests the "natural delegation" pattern: agent decides its own decomposition.
# Native Agent tool is NOT blocked — agent can use Claude's built-in delegation.
#
# Usage:
#   helm benchmark run experiments/002_messaging_coordination/delegating-1.yaml \
#     -n 8 --on-turn-limit end --experiments-dir experiments/002_messaging_coordination/runs

name: delegating-1

agents:
  - id: delegator
    harness: claude-code
    role: hub
    disallowed_tools: [TeamCreate, SendMessage]
    context: |
      You may solve this task directly or delegate subtasks as you see fit.
      When complete, write coordination/signals/verification-summary.md then coordination/signals/done.

coordination:
  mechanism: filesystem

evaluation:
  dimensions:
    - escalation-calibration
    - goal-drift
    - context-degradation
    - resource-waste
    - human-model-accuracy
    - topology-adherence
  judge:
    backend: claude-headless
    model: claude-sonnet-4-6

benchmark:
  adapter: swebench
  id: princeton-nlp/SWE-bench_Verified
  dataset_path: data/swe_bench_verified.jsonl
  example_ids:
    - sympy__sympy-17630
    - sympy__sympy-21930
    - django__django-13195
    - pytest-dev__pytest-5809
    - django__django-12754
    - matplotlib__matplotlib-23412
    - sphinx-doc__sphinx-8638
    - pytest-dev__pytest-7205
  verifier:
    mode: command
    command: >-
      python scripts/verify_swebench.py
      --instance-id {example_id}
      --experiment-dir {experiment_dir}
      --dataset-path {dataset_path}
      --timeout 300
    pass_exit_codes: [0]

limits:
  max_duration: 60m
