[project]
name = "helm-orchestration-policy"
description = "Train/evaluate orchestration policy outputs from Helm benchmark exports."
tags = ["helm", "orchestration", "multi-agent", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.20.0",
    "verifiers>=0.1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "helm_orchestration_policy.py",
    "README.md",
    "pyproject.toml",
    "data/sample.jsonl",
]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
