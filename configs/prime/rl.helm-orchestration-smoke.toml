model = "Qwen/Qwen3-4B-Instruct-2507"
max_steps = 6

# Low-risk smoke settings for helm-orchestration-policy environment.
batch_size = 32
rollouts_per_example = 4
learning_rate = 1e-6

[sampling]
max_tokens = 512
temperature = 0.7

[[env]]
id = "local0ptimist/helm-orchestration-policy"
# Hosted runs require a Hub-published environment slug.
# Optional for larger local datasets:
# args = { dataset_path = "experiments/exports/benchmark-smoke.train.orchestration.jsonl", max_examples = 200 }
