batch_size = 4
rollouts_per_example = 1
learning_rate = 1e-6

[sampling]
max_tokens = 4096
temperature = 0.7

[[env]]
id = "primeintellect/deepswe"
args = { dataset_name = "R2E-Gym/R2E-Gym-Subset", max_turns = 20, total_timeout_minutes = 30 }
