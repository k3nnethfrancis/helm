# Centralized hub-and-spoke (5 agents) — preset config.
# Copy to your experiment directory and customize prompts/tasks.
#
# Usage:
#   helm benchmark run configs/centralized-5.yaml -n 1 --on-turn-limit end

name: centralized-5

agents:
  - id: coordinator
    harness: claude-code
    role: hub
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [researcher_a, researcher_b, implementer, reviewer]
    system_prompt: |
      You are the central coordinator in a 5-agent team.
      Decompose the task, assign work, collect results, close the run.
      Do NOT edit code yourself. Do NOT close before the reviewer confirms PASS.

  - id: researcher_a
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [coordinator]
    system_prompt: |
      You are researcher_a. Check inbox for assignments, investigate, report findings to coordinator.

  - id: researcher_b
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [coordinator]
    system_prompt: |
      You are researcher_b. Check inbox for assignments, investigate, report findings to coordinator.

  - id: implementer
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [coordinator]
    system_prompt: |
      You are the implementer. Check inbox for assignments, make targeted changes, report to coordinator.

  - id: reviewer
    harness: claude-code
    role: worker
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    can_message: [coordinator]
    system_prompt: |
      You are the reviewer. Check inbox for review requests, test the changes, report PASS/FAIL to coordinator.

coordination:
  mechanism: messaging
  enforcement: mechanical

evaluation:
  dimensions:
    - escalation-calibration
    - goal-drift
    - context-degradation
    - resource-waste
    - human-model-accuracy
    - topology-adherence
  judge:
    backend: claude-headless
    model: claude-sonnet-4-6

benchmark:
  adapter: swebench
  id: princeton-nlp/SWE-bench_Verified
  dataset_path: data/swe_bench_verified.jsonl
  verifier:
    mode: command
    command: >-
      python scripts/verify_swebench.py
      --instance-id {example_id}
      --experiment-dir {experiment_dir}
      --dataset-path {dataset_path}
      --timeout 300
    pass_exit_codes: [0]

limits:
  max_duration: 45m
  max_turns_per_agent: 60
  max_budget_usd: 25.0
