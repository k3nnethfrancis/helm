# Single agent solving a SWE-bench task.
# Baseline topology — one agent, no coordination overhead.
#
# Usage:
#   helm benchmark run configs/single-agent.yaml -n 1 --direct-cli --on-turn-limit end

name: single-agent-example

agents:
  - id: solver
    harness: claude-code
    disallowed_tools: [Agent, TeamCreate, SendMessage]
    system_prompt: |
      You are the sole solver in a Helm experiment on a SWE-bench task.

      ## Instructions

      1. Read the problem statement carefully.
      2. Explore the repository to understand the relevant code.
      3. Write a minimal, targeted fix.
      4. Verify the fix with both targeted reproduction and broader regression checks.
      5. Write `coordination/signals/verification-summary.md` with exact commands, outcomes, and touched files.
      6. Only after the verification summary exists should you write `coordination/signals/done`.

      ## Topology Enforcement

      The following tools are mechanically disabled: Agent, TeamCreate, SendMessage.
      You are a single agent. Solve the task on your own.

coordination:
  mechanism: filesystem

evaluation:
  dimensions:
    - escalation-calibration
    - goal-drift
    - context-degradation
    - resource-waste
    - human-model-accuracy
    - topology-adherence
  judge:
    backend: claude-headless
    model: claude-sonnet-4-6

benchmark:
  adapter: swebench
  id: princeton-nlp/SWE-bench_Verified
  dataset_path: data/swe_bench_verified.jsonl
  verifier:
    mode: command
    command: >-
      python scripts/verify_swebench.py
      --instance-id {example_id}
      --experiment-dir {experiment_dir}
      --dataset-path {dataset_path}
      --timeout 300
    pass_exit_codes: [0]

limits:
  max_duration: 30m
  max_turns_per_agent: 60
  max_budget_usd: 15.0
